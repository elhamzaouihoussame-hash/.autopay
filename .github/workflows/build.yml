name: Build HIRO CLIENT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create project files
        run: |
          mkdir -p src/main/java/com/example/autopay src/main/resources/assets/autopay/lang
          if ls *.png >/dev/null 2>&1; then cp "$(ls *.png | head -n1)" src/main/resources/assets/autopay/icon.png; fi
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'autopay'
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.9
          fabric_version=0.108.0+1.21.1
          mod_version=1.0.0
          maven_group=com.example
          archives_base_name=hiro-client
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
          }
          
          version = project.mod_version
          group = project.maven_group
          
          base {
              archivesName = project.archives_base_name
          }
          
          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc:fabric-api:${project.fabric_version}"
          }
          
          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }
          
          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }
          
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_FILE
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "autopay",
            "version": "${version}",
            "name": "HIRO CLIENT",
            "icon": "assets/autopay/icon.png",
            "description": "Right Shift: runs /bal then /pay <target> <your balance>.",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.autopay.AutoPayMod"]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_FILE
          cat > src/main/resources/assets/autopay/lang/en_us.json <<'EOF_FILE'
          {
            "key.autopay.send": "Send all money",
            "key.category.autopay.main": "HIRO CLIENT"
          }
          EOF_FILE
          cat > src/main/java/com/example/autopay/AutoPayMod.java <<'EOF_FILE'
          package com.example.autopay;
          
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public class AutoPayMod implements ClientModInitializer {
          
              private static final String TARGET = ".hip_4030";
              private static final String[] KEYWORDS = {"balance", "bal", "money", "coins", "cash", "$", "رصيد", "فلوس"};
              private static final Pattern NUM = Pattern.compile("([0-9][0-9,]*(?:\\.[0-9]+)?)");
          
              private static KeyBinding key;
              private static volatile boolean waiting = false;
              private static volatile long waitUntil = 0;
          
              @Override
              public void onInitializeClient() {
                  key = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.autopay.send",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          "key.category.autopay.main"
                  ));
          
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (key.wasPressed()) {
                          if (client.player == null) return;
                          waiting = true;
                          waitUntil = System.currentTimeMillis() + 3000;
                          client.player.networkHandler.sendChatCommand("bal");
                      }
                      if (waiting && System.currentTimeMillis() > waitUntil) waiting = false;
                  });
          
                  ClientReceiveMessageEvents.GAME.register((message, overlay) -> {
                      if (!overlay) handle(message);
                  });
                  ClientReceiveMessageEvents.CHAT.register((message, signed, sender, params, ts) -> handle(message));
              }
          
              private static void handle(Text message) {
                  if (!waiting) return;
          
                  String text = message.getString();
                  if (text.startsWith("<")) return;
          
                  String lower = text.toLowerCase();
                  boolean isBal = false;
                  for (String k : KEYWORDS) {
                      if (lower.contains(k)) { isBal = true; break; }
                  }
                  if (!isBal) return;
          
                  Matcher m = NUM.matcher(text);
                  if (!m.find()) return;
          
                  long amount;
                  try {
                      amount = (long) Math.floor(Double.parseDouble(m.group(1).replace(",", "")));
                  } catch (NumberFormatException e) {
                      return;
                  }
                  if (amount <= 0) return;
          
                  waiting = false;
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.execute(() -> {
                      if (mc.player != null) {
                          mc.player.networkHandler.sendChatCommand("pay " + TARGET + " " + amount);
                      }
                  });
              }
          }
          EOF_FILE
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: hiro-client-jar
          path: build/libs/hiro-client-1.0.0.jar
          
          
          
          
